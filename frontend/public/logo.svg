<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" aria-label="Stellar Freelance Platform Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Decentralized escrow orbital rings -->
  <path d="M 12 28 C 12 35, 36 37, 36 29" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 20 C 36 13, 12 11, 12 19" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Counterparty nodes (Client & Freelancer) -->
  <circle cx="12" cy="23.5" r="3" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="36" cy="24.5" r="3" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Central Stellar Diamond Star -->
  <path d="M 24 10 C 24 18, 25 21, 35 24 C 25 27, 24 30, 24 38 C 24 30, 23 27, 13 24 C 23 21, 24 18, 24 10 Z" fill="url(#starGrad)" filter="url(#glow)"/>
  
  <!-- Center core sparkle -->
  <circle cx="24" cy="24" r="2" fill="#2563eb"/>
</svg>
